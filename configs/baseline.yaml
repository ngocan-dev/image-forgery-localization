# Paths are relative to the repository root; run future scripts from there.
# Replace these paths to match your local or Google Drive dataset layout.
seed: 42
device: auto  # Planned: CUDA when available, otherwise CPU.

dataset:
  name: casia_v2
  root: .  # Relative manifest and image/mask paths resolve against this directory.
  authentic_dir: data/raw/authentic
  tampered_dir: data/raw/tampered
  masks_dir: data/masks
  processed_dir: data/processed
  train_manifest: data/splits/train.csv
  val_manifest: data/splits/val.csv
  test_manifest: data/splits/test.csv
  image_size: [256, 256]  # height, width
  require_verified_tampered_masks: true
  authentic_mask: zeros
  split_group_column: source_group  # Fixed manifest column used by the loader.
  split_ratios: [0.7, 0.15, 0.15]  # Approximate group fractions; pass to split_dataset.

model:
  name: unet
  in_channels: 3
  out_channels: 1

training:
  batch_size: 8
  epochs: 30
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.01
  loss:
    name: bce_with_logits_plus_dice  # Planned, not implemented.
    bce_weight: 1.0
    dice_weight: 1.0
  num_workers: 0  # Simple initial setting for Windows and notebooks.

evaluation:
  threshold: 0.5

paths:
  checkpoints_dir: checkpoints
  outputs_dir: outputs
  reports_dir: reports
