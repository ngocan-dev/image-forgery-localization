[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgery-localization"
version = "0.1.0"
description = "RGB image forgery localization research scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "opencv-python-headless>=4.9,<5",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
